---
- name: Prepare failover from the existing DR replica
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate the DR credential
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: credentials
    - name: Prepare failover from the existing DR replica
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: prepare_failover
