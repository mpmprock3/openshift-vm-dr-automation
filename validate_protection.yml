---
- name: Validate the protection survey against DC
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate the attached API credential
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: credentials
    - name: Validate the protection survey against DC
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: validate
