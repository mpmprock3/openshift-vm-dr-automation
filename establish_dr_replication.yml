---
- name: Establish VM replication on DR
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate the attached API credential
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: credentials
    - name: Establish VM replication on DR
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: dr
