---
- name: Verify recovered virtual machines on DR
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate the DR credential
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: credentials
    - name: Verify recovered virtual machines on DR
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: verify_failover
