---
- name: Discover DC VMs and refresh the protection survey
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate the attached API credential
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: credentials
    - name: Discover DC VMs and refresh the protection survey
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: refresh
