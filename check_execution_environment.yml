---
- name: Check execution environment and read-only OpenShift access
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate attached credential
      ansible.builtin.import_role:
        name: vmdr
        tasks_from: credentials
    - name: Show the execution environment Ansible version
      ansible.builtin.debug:
        msg: "This job is running ansible-core {{ ansible_version.full }}; kubernetes.core 6.6.0 requires at least 2.16.0."
    - name: Require the Kubernetes collection minimum Ansible version
      ansible.builtin.assert:
        that: ansible_version.full is version('2.16.0', '>=')
        fail_msg: "This execution environment runs ansible-core {{ ansible_version.full }}. The pinned kubernetes.core 6.6.0 collection requires 2.16.0 or newer. Select a compatible execution environment; the AAP platform version does not determine the job runtime version."
    - name: Verify Kubernetes collection, client libraries and VM API access
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
      register: vm_access
      no_log: true
    - name: Require the VirtualMachine API
      ansible.builtin.assert:
        that: vm_access.api_found | default(false)
    - name: Report environment readiness
      ansible.builtin.debug:
        msg:
          ansible_version: "{{ ansible_version.full }}"
          cluster: "{{ cluster_api }}"
          vm_count: "{{ vm_access.resources | length }}"
          result: Kubernetes module dependencies and read-only VM access work. No resources were changed.
