---
- name: Require a selected recovery group
  ansible.builtin.assert:
    that: label_recovery_target | default('') is match('^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*$')
- name: Load the durable recovery plan
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ label_recovery_target.split("/")[0] }}'
    name: '{{ label_recovery_target.split("/")[1] }}-recovery-plan'
  register: lr_plan_record
- ansible.builtin.assert:
    that:
      - lr_plan_record.resources | length == 1
      - lr_plan_record.resources[0].metadata.labels['app.kubernetes.io/component'] == 'label-recovery-plan'
- ansible.builtin.set_fact:
    lr_plan: '{{ lr_plan_record.resources[0].data["plan.json"] | from_json }}'
- name: Require an enrolled plan on one of its recorded sites
  ansible.builtin.assert:
    that:
      - lr_plan.schema_version == 2
      - ((recovery_cluster_api | default(lookup('env', 'K8S_AUTH_HOST'))) | regex_replace('/$', '')) in [lr_plan.source_api, lr_plan.destination_api]
- name: Check the established replica before a new cutover
  ansible.builtin.include_tasks: check_replica.yml
  when: lr_plan.destination_api == (recovery_cluster_api | default(lookup('env', 'K8S_AUTH_HOST'))) | regex_replace('/$', '')
- name: Resume verification after this site already became active
  ansible.builtin.include_tasks: resume_recovered.yml
  when: lr_plan.source_api == (recovery_cluster_api | default(lookup('env', 'K8S_AUTH_HOST'))) | regex_replace('/$', '')
