---
- ansible.builtin.set_fact:
    lr_old_plan: '{{ label_cutover_plan }}'
- ansible.builtin.assert:
    that: lr_old_plan.destination_api == (recovery_cluster_api | default(lookup('env', 'K8S_AUTH_HOST'))) | regex_replace('/$', '')
- name: Require successful cutover receipt
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ lr_old_plan.destination_namespace }}'
    name: '{{ lr_old_plan.final_name }}-receipt'
  register: lr_receipt
- ansible.builtin.assert:
    that:
      - lr_receipt.resources | length == 1
      - (lr_receipt.resources[0].data['plan.json'] | from_json).mirror_uid == lr_old_plan.mirror_uid
      - (lr_receipt.resources[0].data['snapshot.json'] | from_json).uid == label_final_snapshot.uid
- name: Recheck exact recovered VM and disk incarnations before activation or retry
  ansible.builtin.include_tasks: receipt_identity.yml
- name: Read promoted relationship before release
  kubernetes.core.k8s_info:
    api_version: '{{ recovery_api_version }}'
    kind: AppMirrorRelationship
    namespace: '{{ lr_old_plan.destination_namespace }}'
    name: '{{ lr_old_plan.application }}-mirror'
  register: lr_release
- name: Require this cutover's completed promotion
  ansible.builtin.assert:
    that:
      - lr_release.resources[0].metadata.uid == lr_old_plan.mirror_uid
      - lr_release.resources[0].status.state == 'Promoted'
      - >-
        (label_final_snapshot.mode | default('planned') == 'planned' and
         lr_release.resources[0].spec.promotedSnapshot | default('') == label_final_snapshot.archive.split('/')[-1]) or
        (label_final_snapshot.mode | default('planned') == 'disaster' and
         lr_release.resources[0].spec.promotedSnapshot | default('') == '' and
         (lr_release.resources[0].metadata.annotations | default({})).get('vmdr.aap/recovery-plan', '') == recovery_plan_name)
  when: lr_release.resources | length > 0
- name: Read recovered Application
  kubernetes.core.k8s_info:
    api_version: '{{ recovery_api_version }}'
    kind: Application
    namespace: '{{ lr_old_plan.destination_namespace }}'
    name: '{{ lr_old_plan.application }}'
  register: lr_active_app
- ansible.builtin.assert:
    that:
      - lr_active_app.resources | length == 1
      - lr_active_app.resources[0].spec.resourceFilter | default({}) == {}
      - "lr_active_app.resources[0].spec.includedNamespaces == [{'namespace': lr_old_plan.destination_namespace, 'labelSelector': {'matchLabels': {lr_old_plan.label_key: lr_old_plan.application}}}]"
- name: Release completed relationship without deleting the Application
  kubernetes.core.k8s:
    state: absent
    api_version: '{{ recovery_api_version }}'
    kind: AppMirrorRelationship
    namespace: '{{ lr_old_plan.destination_namespace }}'
    name: '{{ lr_old_plan.application }}-mirror'
    delete_options:
      preconditions:
        uid: '{{ lr_release.resources[0].metadata.uid }}'
        resourceVersion: '{{ lr_release.resources[0].metadata.resourceVersion }}'
    wait: true
    wait_timeout: 300
  when: lr_release.resources | length > 0
- name: Mark verified recovered Application as managed by this automation
  kubernetes.core.k8s:
    state: patched
    api_version: '{{ recovery_api_version }}'
    kind: Application
    namespace: '{{ lr_old_plan.destination_namespace }}'
    name: '{{ lr_old_plan.application }}'
    definition:
      metadata:
        labels:
          app.kubernetes.io/managed-by: '{{ recovery_owner }}'
- name: Enroll the active recovered VM identities and create ongoing snapshots
  ansible.builtin.include_tasks: enroll.yml
  vars:
    recovery_application_name: '{{ lr_old_plan.application }}'
    recovery_source_namespace: '{{ lr_old_plan.destination_namespace }}'
    recovery_destination_namespace: '{{ lr_old_plan.source_namespace }}'
    recovery_destination_api: '{{ lr_old_plan.source_api }}'
    recovery_vms: '{{ lr_old_plan.vms | map(attribute="name") | list }}'
    recovery_vault: '{{ lr_old_plan.vault }}'
    recovery_storage_class: '{{ lr_old_plan.storage_class }}'
    recovery_interval_minutes: '{{ lr_old_plan.interval_minutes }}'
    recovery_baseline_seed: '{{ lr_old_plan.mirror_uid }}'
- name: Prepare internal stage outputs
  ansible.builtin.set_fact:
    lr_outputs:
      label_reprotection_plan: "{{ label_recovery_plan | combine({'retired_application_uid': lr_old_plan.application_uid, 'retired_pvc_uids': lr_old_plan.pvc_uids}) }}"
- name: Pass exact stopped destination identities to reprotection
  register: lr_stage_artifacts
  ansible.builtin.set_stats:
    per_host: false
    aggregate: false
    data:
      label_reprotection_plan: "{{ label_recovery_plan | combine({'retired_application_uid': lr_old_plan.application_uid, 'retired_pvc_uids': lr_old_plan.pvc_uids}) }}"
  when: recovery_export_artifacts | default(true) | bool
