---
- ansible.builtin.set_fact:
    lr_plan: '{{ label_cutover_plan }}'
- name: Require the active source and recent target preflight
  ansible.builtin.assert:
    that:
      - lr_plan.source_api == (recovery_cluster_api | default(lookup('env', 'K8S_AUTH_HOST'))) | regex_replace('/$', '')
      - (now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') | to_datetime('%Y-%m-%dT%H:%M:%SZ') - lr_plan.checked_at | to_datetime('%Y-%m-%dT%H:%M:%SZ')).total_seconds() < 600
- name: Read source selection
  kubernetes.core.k8s_info:
    api_version: '{{ recovery_api_version }}'
    kind: Application
    namespace: '{{ lr_plan.source_namespace }}'
    name: '{{ lr_plan.application }}'
  register: lr_shutdown_app
- name: Require exact source identity and stable label scope
  ansible.builtin.assert:
    that:
      - lr_shutdown_app.resources | length == 1
      - lr_shutdown_app.resources[0].metadata.uid == lr_plan.application_uid
      - lr_shutdown_app.resources[0].spec.resourceFilter | default({}) == {}
      - lr_shutdown_app.resources[0].spec.includedClusterScopedResources | default([]) == []
      - "lr_shutdown_app.resources[0].spec.includedNamespaces == [{'namespace': lr_plan.source_namespace, 'labelSelector': {'matchLabels': {lr_plan.label_key: lr_plan.application}}}]"
- name: Read final snapshot on retries
  kubernetes.core.k8s_info:
    api_version: '{{ recovery_api_version }}'
    kind: ShutdownSnapshot
    namespace: '{{ lr_plan.source_namespace }}'
    name: '{{ lr_plan.final_name }}'
  register: lr_previous_final
- name: Refuse an unrelated existing final snapshot
  ansible.builtin.assert:
    that:
      - lr_previous_final.resources[0].spec.applicationRef == lr_plan.application
      - lr_previous_final.resources[0].spec.appVaultRef == lr_plan.vault
      - lr_previous_final.resources[0].metadata.labels['app.kubernetes.io/managed-by'] | default('') == recovery_owner
  when: lr_previous_final.resources | length > 0
- name: Verify selected source VMs before first shutdown
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: '{{ lr_plan.source_namespace }}'
    label_selectors:
      - '{{ lr_plan.label_key }}={{ lr_plan.application }}'
  register: lr_shutdown_vms
  no_log: true
- name: Require original selected VM incarnations
  ansible.builtin.assert:
    that:
      - lr_shutdown_vms.resources | map(attribute='metadata.uid') | sort == lr_plan.vms | map(attribute='uid') | sort
      - lr_shutdown_vms.resources | map(attribute='metadata.name') | sort == lr_plan.vms | map(attribute='name') | sort
  when: lr_previous_final.resources | length == 0
- name: Verify selected source PVC incarnations
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: '{{ lr_plan.source_namespace }}'
    label_selectors:
      - '{{ lr_plan.label_key }}={{ lr_plan.application }}'
  register: lr_shutdown_pvcs
- ansible.builtin.assert:
    that: lr_shutdown_pvcs.resources | map(attribute='metadata.uid') | sort == lr_plan.pvc_uids | sort
- name: Read source schedules
  kubernetes.core.k8s_info:
    api_version: '{{ recovery_api_version }}'
    kind: Schedule
    namespace: '{{ lr_plan.source_namespace }}'
  register: lr_source_schedules
- name: Refuse to alter unmanaged schedules
  ansible.builtin.assert:
    that: item.metadata.labels['app.kubernetes.io/managed-by'] | default('') == recovery_owner
  loop: "{{ lr_source_schedules.resources | selectattr('spec.applicationRef', 'equalto', lr_plan.application) | list }}"
  loop_control:
    label: '{{ item.metadata.name }}'
- name: Disable this application's managed schedules
  kubernetes.core.k8s:
    state: patched
    api_version: '{{ recovery_api_version }}'
    kind: Schedule
    name: '{{ item.metadata.name }}'
    namespace: '{{ lr_plan.source_namespace }}'
    definition:
      spec:
        enabled: false
  loop: "{{ lr_source_schedules.resources | selectattr('spec.applicationRef', 'equalto', lr_plan.application) | list }}"
  loop_control:
    label: '{{ item.metadata.name }}'
- name: Record cutover intent before shutdown
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ lr_plan.final_name }}-intent'
        namespace: '{{ lr_plan.source_namespace }}'
        labels:
          app.kubernetes.io/managed-by: '{{ recovery_owner }}'
      data:
        plan.json: '{{ lr_plan | to_json }}'
- name: Capture final disk data after application shutdown
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: '{{ recovery_api_version }}'
      kind: ShutdownSnapshot
      metadata:
        name: '{{ lr_plan.final_name }}'
        namespace: '{{ lr_plan.source_namespace }}'
        labels:
          app.kubernetes.io/managed-by: '{{ recovery_owner }}'
      spec:
        applicationRef: '{{ lr_plan.application }}'
        appVaultRef: '{{ lr_plan.vault }}'
        reclaimPolicy: Retain
        cleanupSnapshot: false
- ansible.builtin.include_tasks: wait.yml
  vars:
    lr_kind: ShutdownSnapshot
    lr_name: '{{ lr_plan.final_name }}'
    lr_namespace: '{{ lr_plan.source_namespace }}'
    lr_state: Completed
- name: Require exactly the enrolled disks in the final snapshot
  ansible.builtin.assert:
    that:
      - lr_ready.resources[0].status.pvcs | unique | sort == lr_plan.pvc_uids | sort
      - lr_ready.resources[0].status.volumeSnapshots | length == lr_plan.pvc_uids | length
      - lr_ready.resources[0].status.appArchivePath.startswith(lr_plan.application ~ '_' ~ lr_plan.application_uid ~ '/')
- name: Confirm enrolled source VMIs are absent
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    namespace: '{{ lr_plan.source_namespace }}'
    name: '{{ item.name }}'
  loop: '{{ lr_plan.vms }}'
  register: lr_stopped
  until: lr_stopped.resources | length == 0
  retries: 30
  delay: 5
  no_log: true
- name: Confirm source VM definitions cannot restart themselves
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: '{{ lr_plan.source_namespace }}'
    name: '{{ item.name }}'
  loop: '{{ lr_plan.vms }}'
  register: lr_definitions
  failed_when: lr_definitions.resources | length > 0 and not (lr_definitions.resources[0].spec.runStrategy | default('') == 'Halted' or lr_definitions.resources[0].spec.running | default(true) == false)
  no_log: true
- name: Pass exact recovery point to promotion stage
  register: lr_stage_artifacts
  ansible.builtin.set_stats:
    per_host: false
    aggregate: false
    data:
      label_final_snapshot:
        mirror_uid: '{{ lr_plan.mirror_uid }}'
        uid: '{{ lr_ready.resources[0].metadata.uid }}'
        archive: '{{ lr_ready.resources[0].status.appArchivePath }}'
        checked_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
