---
- ansible.builtin.set_fact:
    fc_verified_stopped_vms: []
- name: Read any already-established replica on retry
  kubernetes.core.k8s_info:
    api_version: '{{ fc_api }}'
    kind: AppMirrorRelationship
    namespace: '{{ fc.destination_namespace }}'
    name: '{{ fc.application }}-mirror'
  register: fc_target_mirror
- name: Validate retained target on subsequent cycles before controller reuse
  when:
    - fc.original.continuation_application is defined
    - fc_target_mirror.resources | length == 0
  block:
    - kubernetes.core.k8s_info:
        api_version: '{{ fc_api }}'
        kind: Application
        namespace: '{{ fc.destination_namespace }}'
        name: '{{ fc.application }}'
      register: fc_target_app
    - ansible.builtin.assert:
        that:
          - fc_target_app.resources | length == 1
          - fc_target_app.resources[0].metadata.uid == fc.original.application_uid
          - fc_target_app.resources[0].spec.resourceFilter | default({}) == {}
          - fc_target_app.resources[0].spec.includedClusterScopedResources | default([]) == []
          - fc_target_app.resources[0].spec.includedNamespaces | sort(attribute='namespace') == (fc.label_plan | lr_app_scope('destination'))
    - ansible.builtin.include_role:
        name: label_recovery
        tasks_from: scope_read
      vars:
        scope_plan: '{{ fc.label_plan }}'
        scope_side: destination
        scope_queries:
          - api_version: kubevirt.io/v1
            kind: VirtualMachineInstance
    - ansible.builtin.set_fact:
        fc_target_vmis: '{{ lr_scope_result }}'
      no_log: true
    - ansible.builtin.assert:
        that: fc_target_vmis.resources | length == 0
    - ansible.builtin.include_role:
        name: label_recovery
        tasks_from: scope_read
      vars:
        scope_plan: '{{ fc.label_plan }}'
        scope_side: destination
        scope_queries:
          - api_version: kubevirt.io/v1
            kind: VirtualMachine
    - ansible.builtin.set_fact:
        fc_target_vms: '{{ lr_scope_result }}'
      no_log: true
    - name: Allow only enrolled stopped VM incarnations for controller-managed replacement
      ansible.builtin.assert:
        that:
          - item.metadata.uid in (fc.original.selected_vms | map(attribute='uid') | list)
          - item.spec.runStrategy | default('') == 'Halted' or item.spec.running | default(true) == false
          - item.metadata.labels['vmdr.aap/protection-group'] | default('') == fc.application
      loop: '{{ fc_target_vms.resources }}'
      no_log: true
    - ansible.builtin.set_fact:
        fc_verified_stopped_vms: '{{ fc_target_vms.resources | map(attribute="metadata.uid") | list }}'
    - ansible.builtin.include_role:
        name: label_recovery
        tasks_from: scope_read
      vars:
        scope_plan: '{{ fc.label_plan }}'
        scope_side: destination
        scope_queries:
          - api_version: v1
            kind: PersistentVolumeClaim
    - ansible.builtin.set_fact:
        fc_target_pvcs: '{{ lr_scope_result }}'
      no_log: true
    - ansible.builtin.assert:
        that:
          - fc_target_pvcs.resources | map(attribute='metadata.uid') | sort == fc.original.continuation_pvc_uids | sort
          - fc_target_pvcs.resources | lr_keys == fc.label_plan | lr_member_keys('pvcs', 'destination')
