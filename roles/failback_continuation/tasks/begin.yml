---
- ansible.builtin.include_role:
    name: vmdr
    tasks_from: resolve_failback_selection
- name: Validate the survey and require explicit namespace policy
  ansible.builtin.assert:
    that:
      - recovery_target | default('') is match('^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9.-]*[a-z0-9]$')
      - failback_destination_policy | default('') == 'Dedicated PROD namespace (retain old copy)'
    fail_msg: Refresh the Fail Back to DC survey and select the dedicated PROD namespace policy. Existing namespace reuse is not implemented.
- name: Refuse to overlap an older filter-based reverse operation
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ recovery_target.split("/")[0] }}'
    name: "reverse-{{ (recovery_target | hash('sha256'))[:24] }}"
  register: fc_legacy_reverse
- ansible.builtin.assert:
    that: fc_legacy_reverse.resources | length == 0
    fail_msg: An old reverse-operation record exists. Reconcile it before starting the continuation; do not delete it to bypass this guard.
- ansible.builtin.set_fact:
    fc_record_name: "continue-{{ (recovery_target | hash('sha256'))[:24] }}"
- kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ recovery_target.split("/")[0] }}'
    name: '{{ fc_record_name }}'
  register: fc_saved
- name: Load only a managed record on this DR endpoint
  when: fc_saved.resources | length == 1
  block:
    - ansible.builtin.assert:
        that: fc_saved.resources[0].metadata.labels['app.kubernetes.io/managed-by'] | default('') == fc_owner
    - ansible.builtin.set_fact:
        fc: '{{ fc_saved.resources[0].data["state.json"] | from_json }}'
    - ansible.builtin.assert:
        that:
          - fc.target == recovery_target
          - fc.original.destination_api == cluster_api
- name: Read the currently enrolled promotion before deciding whether this is a new cycle
  kubernetes.core.k8s_info:
    api_version: '{{ fc_api }}'
    kind: AppMirrorRelationship
    namespace: '{{ recovery_target.split("/")[0] }}'
    name: '{{ recovery_target.split("/")[1] }}'
  register: fc_cycle_mirror
- name: Archive a completed cycle before the next failover's return
  when:
    - fc_saved.resources | length == 1
    - fc.phase == 'complete'
    - fc_cycle_mirror.resources | length == 1
    - fc_cycle_mirror.resources[0].spec.desiredState == 'Promoted'
    - fc_cycle_mirror.resources[0].metadata.uid == fc.forward_uid
  block:
    - kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: '{{ fc_record_name }}-{{ (fc.original.mirror_uid | hash("sha256"))[:8] }}'
            namespace: '{{ fc.original.mirror_namespace }}'
            labels:
              app.kubernetes.io/managed-by: '{{ fc_owner }}'
              app.kubernetes.io/component: failback-continuation-history
          data:
            state.json: '{{ fc | to_json }}'
    - ansible.builtin.set_fact:
        fc_saved: {resources: []}
- name: Start directly from the existing Fail Over to DR catalog
  when: fc_saved.resources | length == 0
  block:
    - ansible.builtin.include_role:
        name: vmdr
        tasks_from: assess_failback_dr
    - name: Preserve the enrolled minutely replication interval
      ansible.builtin.set_fact:
        fc_intervals: "{{ failback_amr_query.resources[0].spec.recurrenceRule | regex_findall('RRULE:FREQ=MINUTELY;INTERVAL=([0-9]+)') }}"
    - ansible.builtin.assert:
        that:
          - fc_intervals | length == 1
          - fc_intervals[0] | int >= 5
          - fc_intervals[0] | int <= 1440
        fail_msg: The existing recurrence rule is outside this workflow's supported minutely schedule. No recovery mutation was performed.
    - name: Require one dedicated DR namespace and supported disk layout
      ansible.builtin.assert:
        that:
          - failback_plan.namespace_mapping | length == 1
          - failback_plan.selected_vms | map(attribute='destination_namespace') | unique | list == [failback_plan.mirror_namespace]
          - failback_plan.selected_vms | map(attribute='disks') | flatten | map(attribute='storage_class') | unique | length == 1
          - failback_amr_query.resources[0].spec.sourceAppVaultRef == failback_amr_query.resources[0].spec.destinationAppVaultRef
        fail_msg: This continuation supports one namespace per group, one storage class, and the same AppVault name at both sites. No resources have been changed.
    - name: Require a dedicated DR workload namespace before automatic adoption
      kubernetes.core.k8s_info:
        api_version: '{{ item.api }}'
        kind: '{{ item.kind }}'
        namespace: '{{ failback_plan.mirror_namespace }}'
      loop:
        - {api: kubevirt.io/v1, kind: VirtualMachine}
        - {api: v1, kind: PersistentVolumeClaim}
        - {api: apps/v1, kind: Deployment}
        - {api: apps/v1, kind: StatefulSet}
        - {api: apps/v1, kind: DaemonSet}
        - {api: batch/v1, kind: Job}
      register: fc_namespace_members
      no_log: true
    - name: Refuse unrelated namespace workloads before changing protection
      ansible.builtin.assert:
        that:
          - fc_namespace_members.results[0].resources | map(attribute='metadata.name') | sort == failback_plan.selected_vms | map(attribute='vm') | map('basename') | sort
          - fc_namespace_members.results[1].resources | map(attribute='metadata.name') | sort == failback_plan.selected_vms | map(attribute='disks') | flatten | map(attribute='pvc') | unique | sort
          - fc_namespace_members.results[2:] | map(attribute='resources') | flatten | length == 0
        fail_msg: Automatic continuation requires a dedicated DR VM namespace with exactly the enrolled VMs and disks. Split unrelated workloads into separate protection namespaces first.
    - ansible.builtin.set_fact:
        fc:
          target: '{{ recovery_target }}'
          original: '{{ failback_plan }}'
          original_amr: '{{ failback_amr_query.resources[0] }}'
          legacy_dr_application: '{{ failback_dr_application_name }}'
          legacy_dr_application_uid: '{{ failback_application.resources[0].metadata.uid }}'
          application: "{{ failback_plan.continuation_application | default('fb-app-' ~ (recovery_target | hash('sha256'))[:16]) }}"
          destination_namespace: "{{ failback_plan.application_namespace if failback_plan.continuation_application is defined else 'prod-return-' ~ (failback_plan.mirror_uid | hash('sha256'))[:16] }}"
          interval_minutes: '{{ fc_intervals[0] | int }}'
          phase: discovered
    - ansible.builtin.include_tasks: save.yml
- name: Enroll the running DR group automatically before releasing its old mirror
  when: fc.phase == 'discovered'
  block:
    - ansible.builtin.include_role:
        name: label_recovery
        tasks_from: enroll
      vars:
        recovery_export_artifacts: false
        recovery_cluster_api: '{{ cluster_api }}'
        recovery_application_name: '{{ fc.application }}'
        recovery_source_namespace: '{{ fc.original.mirror_namespace }}'
        recovery_destination_namespace: '{{ fc.destination_namespace }}'
        recovery_destination_api: '{{ fc.original.source_api }}'
        recovery_vms: '{{ fc.original.selected_vms | map(attribute="vm") | map("basename") | list }}'
        recovery_vault: '{{ fc.original_amr.spec.destinationAppVaultRef }}'
        recovery_storage_class: '{{ fc.original.selected_vms[0].disks[0].storage_class }}'
        recovery_baseline_seed: '{{ fc.original.mirror_uid }}'
        recovery_interval_minutes: '{{ fc.interval_minutes }}'
    - ansible.builtin.set_fact:
        fc: "{{ fc | combine({'phase': 'enrolled', 'label_plan': label_recovery_plan}) }}"
    - ansible.builtin.include_tasks: save.yml
- name: Reject a later failover or foreign relationship on retry
  kubernetes.core.k8s_info:
    api_version: '{{ fc_api }}'
    kind: AppMirrorRelationship
    namespace: '{{ fc.original.mirror_namespace }}'
    name: '{{ fc.original.mirror_name }}'
  register: fc_old_mirror
- ansible.builtin.assert:
    that:
      - >-
        (fc_old_mirror.resources[0].metadata.uid == fc.original.mirror_uid and
         fc_old_mirror.resources[0].spec.desiredState == 'Promoted' and
         fc_old_mirror.resources[0].status.state == 'Promoted') or
        (fc.protection is defined and
         fc_old_mirror.resources[0].spec.sourceApplicationUID == fc.protection.application_uid and
         fc_old_mirror.resources[0].spec.desiredState == 'Established' and
         (fc.phase != 'complete' or fc_old_mirror.resources[0].metadata.uid == fc.forward_uid))
  when: fc_old_mirror.resources | length > 0
- name: Check the successor relationship before retrying an obsolete dropdown entry
  kubernetes.core.k8s_info:
    api_version: '{{ fc_api }}'
    kind: AppMirrorRelationship
    namespace: '{{ fc.original.mirror_namespace }}'
    name: '{{ fc.application }}-mirror'
  register: fc_successor
  when: fc.phase == 'complete' and fc.original.mirror_name != fc.application ~ '-mirror'
- ansible.builtin.assert:
    that:
      - fc_successor.resources | length == 1
      - fc_successor.resources[0].metadata.uid == fc.forward_uid
      - fc_successor.resources[0].spec.desiredState == 'Established'
    fail_msg: A later failover has started. Refresh Failback Groups and select the current group instead of retrying this old operation.
  when: fc.phase == 'complete' and fc.original.mirror_name != fc.application ~ '-mirror'
- ansible.builtin.include_tasks: save.yml
- ansible.builtin.debug:
    msg: 'Failback target is PROD {{ fc.destination_namespace }}. The old stopped PROD VM and disk are retained. No manual enrollment job is required.'
