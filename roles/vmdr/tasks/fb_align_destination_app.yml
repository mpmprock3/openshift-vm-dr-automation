---
# Trident Protect reuses an existing destination Application of the same name only
# when its definition matches the replicated source Application. Otherwise the new
# AMR stays Establishing with
#   "Existing app definition is different that expected, cannot reuse the application".
# Failback rebuilds selectors on whichever side is active, so before an AMR is created
# toward the other side, copy the source filter verbatim onto the destination
# Application (destination copies keep source matchers unchanged) and keep the
# original for review. The side that becomes active later rebuilds its own filter.
#
# Inputs:
#   align_app_namespace / align_app_name / align_app_uid   destination Application
#   align_namespaces       expected destination includedNamespaces (immutable)
#   align_filter           source Application resourceFilter
#   align_record_name      ConfigMap that keeps the original destination filter
#   align_amr_name         AMR that will be (re)created in align_app_namespace
#   align_amr_source_uid   sourceApplicationUID of that AMR
- name: Read destination Application {{ align_app_name }} before reverse reuse
  kubernetes.core.k8s_info:
    api_version: "{{ protect_api_version }}"
    kind: Application
    namespace: "{{ align_app_namespace }}"
    name: "{{ align_app_name }}"
  register: fb_align_app
- name: Require the expected destination Application identity and namespace scope
  ansible.builtin.assert:
    that:
      - fb_align_app.resources[0].metadata.uid == align_app_uid
      - fb_align_app.resources[0].spec.includedNamespaces | map(attribute='namespace') | sort == align_namespaces | sort
      - align_filter is mapping
      - align_filter.resourceMatchers | default([]) | length > 0
    fail_msg: >-
      Destination Application {{ align_app_namespace }}/{{ align_app_name }} was replaced, has a different
      namespace scope, or the source filter is empty. It was not changed; review it before retrying.
  when: fb_align_app.resources | length > 0
- name: Decide whether the destination selection differs from the source
  ansible.builtin.set_fact:
    fb_align_needed: "{{ fb_align_app.resources | length > 0 and fb_align_app.resources[0].spec.resourceFilter | default({}) != align_filter }}"
- name: Read any earlier copy of the original destination selection
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: "{{ align_app_namespace }}"
    name: "{{ align_record_name }}"
  register: fb_align_saved
  when: fb_align_needed | bool
- name: Keep the original destination selection for review before changing it
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ align_record_name }}"
        namespace: "{{ align_app_namespace }}"
        labels:
          app.kubernetes.io/managed-by: "{{ protect_owner }}"
          app.kubernetes.io/component: failback-app-filter
      data:
        application: "{{ align_app_name }}"
        original-filter.json: "{{ fb_align_app.resources[0].spec.resourceFilter | default({}) | to_json }}"
        aligned-filter.json: "{{ align_filter | to_json }}"
  when:
    - fb_align_needed | bool
    - fb_align_saved.resources | default([]) | length == 0
- name: Align the destination Application filter with the source for reverse reuse
  kubernetes.core.k8s_json_patch:
    api_version: "{{ protect_api_version }}"
    kind: Application
    namespace: "{{ align_app_namespace }}"
    name: "{{ align_app_name }}"
    patch:
      - {op: test, path: /metadata/uid, value: "{{ fb_align_app.resources[0].metadata.uid }}"}
      - {op: test, path: /metadata/resourceVersion, value: "{{ fb_align_app.resources[0].metadata.resourceVersion }}"}
      - {op: add, path: /spec/resourceFilter, value: "{{ align_filter }}"}
  when: fb_align_needed | bool
- name: Read relationship {{ align_amr_name }} left by an earlier attempt
  kubernetes.core.k8s_info:
    api_version: "{{ protect_api_version }}"
    kind: AppMirrorRelationship
    namespace: "{{ align_app_namespace }}"
    name: "{{ align_amr_name }}"
  register: fb_align_amr
- name: Remove only a never-transferred relationship that failed on application reuse
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ protect_api_version }}"
    kind: AppMirrorRelationship
    namespace: "{{ align_app_namespace }}"
    name: "{{ align_amr_name }}"
    delete_options:
      preconditions:
        uid: "{{ fb_align_amr.resources[0].metadata.uid }}"
        resourceVersion: "{{ fb_align_amr.resources[0].metadata.resourceVersion }}"
    wait: true
    wait_timeout: "{{ protect_wait_seconds }}"
  when:
    - fb_align_amr.resources | length == 1
    - fb_align_amr.resources[0].metadata.labels['app.kubernetes.io/managed-by'] | default('') == protect_owner
    - fb_align_amr.resources[0].spec.sourceApplicationUID == align_amr_source_uid
    - fb_align_amr.resources[0].spec.desiredState == 'Established'
    - fb_align_amr.resources[0].status.state | default('') != 'Established'
    - fb_align_amr.resources[0].status.lastTransfer.completionTimestamp | default('', true) | length == 0
    - fb_align_amr.resources[0].status.lastTransferredSnapshot.name | default('', true) | length == 0
    - "'cannot reuse the application' in (fb_align_amr.resources[0].status.error | default('', true))"
