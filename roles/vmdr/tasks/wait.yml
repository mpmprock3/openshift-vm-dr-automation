---
- name: Wait for {{ wait_kind }} {{ wait_name }} to report {{ wait_state }}
  kubernetes.core.k8s_info:
    api_version: "{{ protect_api_version }}"
    kind: "{{ wait_kind }}"
    namespace: "{{ wait_namespace }}"
    name: "{{ wait_name }}"
  register: readiness
  until: >-
    readiness.resources | length == 1 and
    ((readiness.resources[0].status.state | default('') == wait_state) or
     (wait_kind == 'Application' and
      readiness.resources[0].status.conditions | default([]) |
      selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0) or
     readiness.resources[0].status.state | default('') in ['Failed', 'Error', 'Invalid'] or
     readiness.resources[0].status.error | default('', true) | length > 0 or
     readiness.resources[0].status.conditions | default([]) | selectattr('reason', 'defined') |
     selectattr('reason', 'equalto', 'Error') | selectattr('status', 'equalto', 'False') | list | length > 0)
  retries: "{{ ((protect_wait_seconds | int) / (protect_poll_seconds | int)) | round(0, 'ceil') | int }}"
  delay: "{{ protect_poll_seconds }}"
- name: Surface controller errors even when the high-level state remains in progress
  ansible.builtin.assert:
    that:
      - readiness.resources[0].status.state | default('') not in ['Failed', 'Error', 'Invalid']
      - readiness.resources[0].status.error | default('', true) | length == 0
      - readiness.resources[0].status.conditions | default([]) | selectattr('reason', 'defined') | selectattr('reason', 'equalto', 'Error') | selectattr('status', 'equalto', 'False') | list | length == 0
    fail_msg: "Controller reported an error; no automatic reset or deletion was performed: {{ readiness.resources[0].status | default({}) }}"
