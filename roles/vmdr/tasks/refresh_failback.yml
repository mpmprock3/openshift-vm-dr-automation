---
- name: Discover enrolled catalogs on DR
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    label_selectors:
      - app.kubernetes.io/component=recovery-plan
      - "app.kubernetes.io/managed-by={{ protect_owner }}"
  register: failback_choice_catalogs
- name: Discover current replication states
  kubernetes.core.k8s_info:
    api_version: "{{ protect_api_version }}"
    kind: AppMirrorRelationship
  register: failback_choice_amrs
- name: Initialize eligible group choices
  ansible.builtin.set_fact:
    failback_choices: []
- name: Select currently promoted enrolled groups
  ansible.builtin.include_tasks: failback_choice.yml
  loop: "{{ failback_choice_catalogs.resources }}"
  loop_control:
    loop_var: failback_choice_catalog
    label: "{{ failback_choice_catalog.metadata.name }}"
- name: Discover resumable continuation records
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    label_selectors:
      - app.kubernetes.io/component=failback-continuation
      - "app.kubernetes.io/managed-by={{ protect_owner }}"
  register: fc_choice_records
- name: Include interrupted operations after the old mirror has been released
  ansible.builtin.set_fact:
    failback_choices: "{{ failback_choices + [saved.original.protection_plan ~ ' (' ~ (saved.original.selected_vms | map(attribute='vm') | join(', ')) ~ ') | ' ~ saved.target] }}"
  vars:
    saved: '{{ item.data["state.json"] | from_json }}'
  loop: '{{ fc_choice_records.resources }}'
  when:
    - saved.original.destination_api == cluster_api
    - saved.phase != 'complete'
- name: Find the preparation job template
  ansible.builtin.include_tasks: survey_api.yml
  vars:
    survey_path: "/api/controller/v2/{{ failback_survey_template_type | default('job_templates') }}/?{{ {'name': failback_survey_template_name | default('Prepare DR Failback Source')} | urlencode }}"
- name: Require the expected preparation playbook
  ansible.builtin.assert:
    that:
      - survey_response.json.count == 1
      - failback_survey_template_type | default('job_templates') == 'workflow_job_templates' or survey_response.json.results[0].playbook == 'prepare_dr_failback_source.yml'
- name: Record job endpoint and survey
  ansible.builtin.set_fact:
    failback_job_path: "/api/controller/v2/{{ failback_survey_template_type | default('job_templates') }}/{{ survey_response.json.results[0].id }}/"
    failback_choice_survey:
      name: Return VMs to PROD
      description: Select the protected group currently active on DR. Preparation and tracking IDs are automatic. The first return uses a dedicated PROD namespace and retains the old stopped copy.
      spec:
        - question_name: "{{ 'Which protected VM group should return to DC?' if failback_survey_template_name | default('') == 'Fail Back to DC' else 'Which protected VM group should be prepared for return to DC?' }}"
          question_description: "{{ 'Planned failback stops the selected DR VMs, recovers DC from the final shutdown snapshot, and restores DC-to-DR replication.' if failback_survey_template_name | default('') == 'Fail Back to DC' else 'Establish DR-to-DC replication, removing the old promoted AMR and enrolled DC schedules. DR remains active; no final cutover.' if failback_survey_template_type | default('job_templates') == 'workflow_job_templates' else 'Prepare a DR baseline snapshot. This does not perform cutover.' }}"
          variable: failback_group
          type: multiplechoice
          required: true
          default: ''
          min: 0
          max: 1024
          choices: "{{ (failback_choices | unique | sort) if failback_choices | length > 0 else ['No eligible promoted groups — refresh after failover'] }}"
- name: Explain and select the destination policy for complete failback
  ansible.builtin.set_fact:
    failback_choice_survey: "{{ failback_choice_survey | combine({'spec': failback_choice_survey.spec + [{'question_name': 'Where should the VM return on PROD?', 'question_description': 'First return creates a dedicated PROD namespace and retains the original stopped VM/disk. Later cycles reuse that new namespace. Original namespace reuse is not supported by this continuation.', 'variable': 'failback_destination_policy', 'type': 'multiplechoice', 'required': true, 'default': 'Dedicated PROD namespace (retain old copy)', 'choices': ['Dedicated PROD namespace (retain old copy)']}]}) }}"
  when: failback_survey_template_name | default('') == 'Fail Back to DC'
- name: Add optional application verification for complete failback
  ansible.builtin.set_fact:
    failback_choice_survey: "{{ failback_choice_survey | combine({'spec': failback_choice_survey.spec + [{'question_name': 'Optional DC application health URL (HTTP 200 expected)', 'question_description': 'Use an endpoint that resolves to the recovered DC application. Leave empty to verify VM readiness only.', 'variable': 'failback_health_url', 'type': 'text', 'required': false, 'default': '', 'min': 0, 'max': 2048}]}) }}"
  when: failback_survey_template_name | default('') == 'Fail Back to DC'
- name: Read existing preparation survey
  ansible.builtin.include_tasks: survey_api.yml
  vars:
    survey_path: "{{ failback_job_path }}survey_spec/"
- name: Refuse to replace unrelated survey questions
  ansible.builtin.assert:
    that: survey_response.json.spec | default([]) | map(attribute='variable') | difference(['failback_group', 'recovery_target', 'failback_request_id', 'failback_health_url', 'failback_destination_policy']) | length == 0
- name: Save the customer selection survey
  ansible.builtin.include_tasks: survey_api.yml
  vars:
    survey_path: "{{ failback_job_path }}survey_spec/"
    survey_method: POST
    survey_body: "{{ failback_choice_survey }}"
- name: Enable the survey and serialize preparation launches
  ansible.builtin.include_tasks: survey_api.yml
  vars:
    survey_path: "{{ failback_job_path }}"
    survey_method: PATCH
    survey_body: "{{ {'survey_enabled': true, 'allow_simultaneous': false} }}"
- name: Report discovered groups
  ansible.builtin.debug:
    msg:
      choices: "{{ failback_choices }}"
      next: "Open a fresh {{ failback_survey_template_name | default('Prepare DR Failback Source') }} launch form and select a group. No cluster resources were changed by this refresh."
