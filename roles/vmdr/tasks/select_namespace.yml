---
- name: Require VMs in the selected namespace
  ansible.builtin.assert:
    that:
      - selected_namespace is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
      - vm_inventory.resources | selectattr('metadata.namespace', 'equalto', selected_namespace) | list | length > 0
    fail_msg: "Selected namespace {{ selected_namespace }} contains no VMs."
- name: Include namespace VMs in the selection
  ansible.builtin.set_fact:
    selected_vm_names: "{{ selected_vm_names + (vm_index.keys() | select('match', '^' ~ selected_namespace ~ '/') | list) }}"
