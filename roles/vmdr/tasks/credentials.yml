---
- name: Require an explicit OpenShift API credential
  ansible.builtin.assert:
    that:
      - lookup('env', 'K8S_AUTH_HOST') is match('^https://[^/]+/?$')
      - lookup('env', 'K8S_AUTH_API_KEY') | length > 0
    fail_msg: Attach the OpenShift DC or DR API credential to this job template.
  no_log: true
- name: Record the API endpoint without credentials
  ansible.builtin.set_fact:
    cluster_api: "{{ lookup('env', 'K8S_AUTH_HOST') | regex_replace('/$', '') }}"
- name: Refuse check mode for a workflow that requires created resource UIDs
  ansible.builtin.assert:
    that: not ansible_check_mode
    fail_msg: Use the read-only validation job for preflight checks; run protection in normal mode.
- name: Validate bounded polling settings
  ansible.builtin.assert:
    that:
      - protect_wait_seconds | int > 0
      - protect_poll_seconds | int > 0
    fail_msg: Polling interval and timeout must be positive seconds.
