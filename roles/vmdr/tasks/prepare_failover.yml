---
- name: Load enrolled recovery plan
  ansible.builtin.include_tasks: load_recovery.yml
- name: Validate existing replica and rerun state
  ansible.builtin.include_tasks: recovery_guard.yml
- name: Discover DR nodes
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: recovery_nodes
- name: Read DR KubeVirt configuration for explicitly enabled POC emulation
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: KubeVirt
    namespace: openshift-cnv
  register: recovery_kubevirt
  when: protect_allow_emulation | bool
- name: Validate hardware or explicitly enabled POC compute
  ansible.builtin.include_tasks: recovery_compute.yml
- name: Verify destination disks and check for unrelated VMs
  ansible.builtin.include_tasks: recovery_destination.yml
  loop: "{{ recovery_plan.selected_vms }}"
  loop_control:
    loop_var: recovery_vm
    label: "{{ recovery_vm.vm }}"
- name: Display the recovery scope and recovery point
  ansible.builtin.debug:
    msg:
      relationship: "{{ recovery_namespace }}/{{ recovery_relationship }}"
      entire_protected_group: "{{ recovery_plan.selected_vms | map(attribute='vm') | list }}"
      snapshot: "{{ recovery_amr.status.lastTransferredSnapshot }}"
      snapshot_completion_age_seconds: "{{ recovery_snapshot_age_seconds }}"
      compute_mode: "{{ recovery_compute_mode }}"
      source_handling: "{{ source_isolation_mode }}"
      limitations: No new source snapshot or final sync. Compute and PVC checks do not prove scheduling capacity, network reachability, guest IP preservation or application consistency.
- name: Pass prepared recovery plan to the next workflow node
  ansible.builtin.set_stats:
    per_host: false
    aggregate: false
    data:
      prepared_failover:
        plan: "{{ recovery_plan }}"
        plan_hash: "{{ recovery_plan_hash }}"
        request_id: "{{ failover_request_id }}"
        source_mode: "{{ source_isolation_mode }}"
