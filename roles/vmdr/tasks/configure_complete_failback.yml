---
- name: Initialize setup identities
  ansible.builtin.set_fact:
    base_templates: {}
    failover_template_ids: {}
    failover_node_ids: {}
- name: Reuse existing working template configuration
  ansible.builtin.include_tasks: read_base_template.yml
  loop: [Configure DC Protection, Establish DR Replication, Refresh Failback Choices]
  loop_control:
    loop_var: base_template_name
- name: Create or verify reverse stage templates
  ansible.builtin.include_tasks: configure_failover_job.yml
  loop:
    - {name: Begin Failback, playbook: begin_failback.yml, base: Establish DR Replication}
    - {name: Prepare Failback DC, playbook: prepare_failback_dc.yml, base: Configure DC Protection}
    - {name: Release Failback DR, playbook: release_failback_dr.yml, base: Establish DR Replication}
    - {name: Check Failback DC, playbook: check_failback_dc.yml, base: Configure DC Protection}
    - {name: Shutdown Failback DR, playbook: shutdown_failback_dr.yml, base: Establish DR Replication}
    - {name: Recover Failback DC, playbook: recover_failback_dc.yml, base: Configure DC Protection}
    - {name: Reprotect Failback DR, playbook: reprotect_failback_dr.yml, base: Establish DR Replication}
    - {name: Refresh Failback Groups, playbook: refresh_failback_groups.yml, base: Refresh Failback Choices}
  loop_control:
    loop_var: failover_job
- ansible.builtin.include_tasks: survey_api.yml
  vars:
    survey_path: "/api/controller/v2/workflow_job_templates/?{{ {'name': 'Enable DR Protection'} | urlencode }}"
- ansible.builtin.assert:
    that: survey_response.json.count == 1
- ansible.builtin.set_fact:
    reverse_organization: "{{ survey_response.json.results[0].organization }}"
- ansible.builtin.include_tasks: survey_api.yml
  vars:
    survey_path: "/api/controller/v2/workflow_job_templates/?{{ {'name': 'Fail Back to DC'} | urlencode }}"
- name: Refuse ambiguous or foreign workflows
  ansible.builtin.assert:
    that:
      - survey_response.json.count | int <= 1
      - survey_response.json.count == 0 or survey_response.json.results[0].description == 'Managed by vmdr complete failback setup'
      - survey_response.json.count == 0 or survey_response.json.results[0].organization | string == reverse_organization | string
      - survey_response.json.count == 0 or not survey_response.json.results[0].allow_simultaneous
- name: Create the independent reverse replication workflow
  ansible.builtin.include_tasks: survey_api.yml
  vars:
    survey_path: /api/controller/v2/workflow_job_templates/
    survey_method: POST
    survey_body: "{{ {'name': 'Fail Back to DC', 'description': 'Managed by vmdr complete failback setup', 'organization': reverse_organization | int, 'allow_simultaneous': false, 'survey_enabled': true, 'extra_vars': {'protect_allow_emulation': protect_allow_emulation | bool} | to_json} }}"
  when: survey_response.json.count == 0
- ansible.builtin.set_fact:
    failover_workflow_id: "{{ survey_response.json.id | default((survey_response.json.results | default([{}]) | first).id) }}"
- ansible.builtin.include_tasks: survey_api.yml
  vars:
    survey_path: "/api/controller/v2/workflow_job_templates/{{ failover_workflow_id }}/workflow_nodes/?page_size=200"
- name: Reject unexpected nodes
  ansible.builtin.assert:
    that:
      - survey_response.json.next | default(none) == none
      - survey_response.json.results | map(attribute='identifier') | difference(['fb-begin', 'fb-prepare', 'fb-release', 'fb-check', 'fb-shutdown', 'fb-recover', 'fb-reprotect']) | length == 0
- name: Create serial reverse stages
  ansible.builtin.include_tasks: configure_failover_node.yml
  loop:
    - {identifier: fb-begin, job: Begin Failback}
    - {identifier: fb-prepare, job: Prepare Failback DC}
    - {identifier: fb-release, job: Release Failback DR}
    - {identifier: fb-check, job: Check Failback DC}
    - {identifier: fb-shutdown, job: Shutdown Failback DR}
    - {identifier: fb-recover, job: Recover Failback DC}
    - {identifier: fb-reprotect, job: Reprotect Failback DR}
  loop_control:
    loop_var: failover_node
- name: Connect success-only stages
  ansible.builtin.include_tasks: configure_failover_edge.yml
  loop:
    - {source: fb-begin, destination: fb-prepare}
    - {source: fb-prepare, destination: fb-release}
    - {source: fb-release, destination: fb-check}
    - {source: fb-check, destination: fb-shutdown}
    - {source: fb-shutdown, destination: fb-recover}
    - {source: fb-recover, destination: fb-reprotect}
    - {source: fb-reprotect, destination: ''}
  loop_control:
    loop_var: failover_edge
- name: Populate the workflow group survey
  ansible.builtin.include_tasks: refresh_failback.yml
  vars:
    failback_survey_template_name: Fail Back to DC
    failback_survey_template_type: workflow_job_templates
- ansible.builtin.debug:
    msg: Fail Back to DC is configured, not launched. Launch it separately to stop the selected DR VMs, recover DC from the final snapshot, and restore DC-to-DR protection.
