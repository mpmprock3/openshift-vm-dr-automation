---
- name: Check cleanup runs in normal job mode
  ansible.builtin.assert:
    that: not ansible_check_mode
    fail_msg: Launch Reset DR Lab as a Run job. For a dry run, select Preview in its survey instead of Ansible check mode.
- name: Validate cleanup survey action
  ansible.builtin.assert:
    that: lab_cleanup_mode | default('Preview') in ['Preview', 'Delete']
    fail_msg: Select Preview or Delete in the Reset DR Lab survey. Rerun Configure Lab Cleanup if the survey is outdated.
- name: Require explicit deletion confirmation
  ansible.builtin.assert:
    that: lab_cleanup_mode | default('Preview') != 'Delete' or lab_cleanup_confirmation | default('') == 'DELETE LAB DATA'
    fail_msg: Delete requires the exact confirmation DELETE LAB DATA. Select Preview to inspect without deleting anything.
- name: Check credential injection without exposing secret values
  ansible.builtin.set_fact:
    lc_api_valid: "{{ lookup('env', 'K8S_AUTH_HOST') is match('^https://[^/]+/?$') }}"
    lc_token_present: "{{ lookup('env', 'K8S_AUTH_API_KEY') | length > 0 }}"
  no_log: true
- name: Require the cluster API endpoint
  ansible.builtin.assert:
    that: lc_api_valid | bool
    fail_msg: >-
      The {{ lab_cleanup_site | upper }} stage has no valid K8S_AUTH_HOST credential injection.
      Check its OpenShift API credential (HTTPS server URL with no API path).
      Configure Lab Cleanup copies PROD credentials from Configure DC Protection
      and DR credentials from Establish DR Replication. The AAP Survey Updater alone is not a cluster credential.
- name: Require the cluster API token
  ansible.builtin.assert:
    that: lc_token_present | bool
    fail_msg: >-
      The {{ lab_cleanup_site | upper }} stage has no K8S_AUTH_API_KEY credential injection.
      Attach the same OpenShift API credential used by the working cluster protection job.
      Do not paste tokens into job output or chat.
- name: Parse explicitly selected namespaces
  ansible.builtin.set_fact:
    lc_namespaces: "{{ lookup('vars', 'lab_cleanup_' ~ lab_cleanup_site ~ '_namespaces', default='').replace(',', ' ').split() | unique | list }}"
- name: Require a bounded explicit namespace list
  ansible.builtin.assert:
    that:
      - lc_namespaces | length > 0
      - lc_namespaces | length <= 20
- name: Refuse infrastructure and shared namespaces
  ansible.builtin.assert:
    that:
      - item is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - item not in ['default', 'vmdr-control', 'aap', 'ansible-automation-platform', 'trident', 'trident-protect', 'kube-system', 'kube-public', 'kube-node-lease', 'openshift', 'openshift-virtualization']
      - not item.startswith(('openshift-', 'kube-', 'trident-', 'aap-', 'ansible-'))
    fail_msg: Only dedicated lab workload namespaces are allowed. Never select infrastructure or shared namespaces.
  loop: '{{ lc_namespaces }}'
