---
- name: Save checkpoint while proving lock ownership
  kubernetes.core.k8s_json_patch:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ recovery_control_namespace }}'
    name: '{{ rp_lock_name }}'
    patch:
      - {op: test, path: /data/owner, value: '{{ rp_owner }}'}
      - op: replace
        path: /data
        value: "{{ rp_journal | combine({'owner': rp_owner, 'artifacts': rp_artifacts | to_json}) }}"
