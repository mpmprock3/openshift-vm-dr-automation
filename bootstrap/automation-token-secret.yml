# POC/LAB ONLY: a non-expiring token for the AAP automation service account.
# Avoids the "HTTP 401 Unauthorized" failures caused by short-lived `oc create token` tokens.
# The account has cluster-admin in this POC, so treat the token like a cluster-admin password.
# Apply AFTER bootstrap/automation-serviceaccount.yml, once on DC and once on DR.
# Read it with:
#   oc -n aap-automation get secret aap-dr-automation-token -o jsonpath='{.data.token}' | base64 -d
# Revoke it with:
#   oc -n aap-automation delete secret aap-dr-automation-token
apiVersion: v1
kind: Secret
metadata:
  name: aap-dr-automation-token
  namespace: aap-automation
  annotations:
    kubernetes.io/service-account.name: aap-dr-automation
type: kubernetes.io/service-account-token
